<body>
    <script>
        //구구단
        for( dan = 2; dan < 10; dan++) {
            console.log(dan + "단")
            for (i=1 ; 1<10; i++) {
                console.log(dan + "*" + i + " = " + dan*i)
            }
            console.log("===")
        }
        console.log("구구단 끝")
        
        for( let dan = 11; dan < 20; dan++) {
            console.log(dan + "단")
            for (let i=1 ; 1<10; i++) {
                console.log(dan + "*" + i + " = " + dan*i)
            }
            console.log("===")
        }
        console.log(dan)
    </script>
    
</body>
