<!DOCTYPE html>
<html lang="ko">
<head>

    <title>애니메이션 만들기</title>
    
    <link rel="stylesheet" href="animation.css">

</head>
<body>

        <!-- 달-->
        <div class="moon"></div>

        <button id="dayNightBtn">☀️ 낮으로 바꾸기</button>
    </div>
    
    <script src="animation.js"></script>
